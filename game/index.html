<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<meta name="description" content="Ember Drift: a small flame against the long night. Collect motes, dodge rain, hail and ash wisps, break the storm and choose a boon between waves.">
<title>Ember Drift — a small flame against the long night</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #04050c;
    color: #edf3ff;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
  /* Read aloud, never shown: the screen-reader status line. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Ember Drift: steer a small flame through the night, collect fuel motes, dodge rain, hail and ash wisps, break the storm and keep the flame alive."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
